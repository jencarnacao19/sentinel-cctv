[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-cctv"
version = "2.0.0"
description = "Local-first RTSP video surveillance with continuous recording and CPU motion detection"
# No `readme` on purpose: the Docker build copies only pyproject.toml and app/,
# and a missing readme file would fail the install.
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.141",
    # Pinned explicitly: HTTP_422_UNPROCESSABLE_CONTENT and the current
    # WebSocket API both require the 1.x line.
    "starlette>=1.6",
    "uvicorn[standard]>=0.32",
    # Used as a *client* to proxy the browser's live-stream socket to go2rtc.
    # uvicorn[standard] already pulls it in; declared because we import it.
    "websockets>=13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "aiosqlite>=0.20",
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "PyJWT[crypto]>=2.10.1,<3",
    "httpx>=0.27",
    # Tapo's patrol/cruise command is proprietary rather than ONVIF. Keep it
    # local to the camera account already used for RTSP/ONVIF control.
    "pytapo>=3.4.18,<3.5",
    # pytapo's event downloader imports aiofiles but does not declare it.
    "aiofiles>=24.1,<25",
    "python-multipart>=0.0.17",
    "pyyaml>=6.0",
    "psutil>=6.1",
    "zeroconf>=0.136",
    "numpy>=2.1",
    "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "types-psutil>=6.1",
]

[project.scripts]
sentinel = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "C4", "SIM", "RUF", "ASYNC", "BLE"]
ignore = [
    "S104",  # binding 0.0.0.0 is intentional and documented for the LAN-only API
    "B008",  # FastAPI Depends() in defaults is the framework idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",
    "S105",
    "S106",
    "S108",
    # A stub standing in for a real async function has to match its signature,
    # `timeout` parameter included. Rewriting the double to satisfy the rule
    # would mean it no longer matches what it replaces.
    "ASYNC109",
    # A fixture waiting for a real uvicorn server to bind a port has nothing to
    # await on: the server exposes a flag, not an event.
    "ASYNC110",
]
# Holds ProbeMatches payloads captured verbatim from real cameras. Rewrapping
# them to fit the line limit would make them no longer what the device sent,
# which is the entire reason for keeping them.
"tests/test_discovery_wsdiscovery.py" = ["E501", "S101", "S105", "S106", "S108"]
"alembic/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = false
ignore_missing_imports = true
