name: Dev image

# The dev branch carries work in progress, such as Tapo battery cameras, that is
# not in releases yet. Every push to it publishes ghcr.io/<repo>:dev (and a
# dev-<sha> tag) so it can be installed on a test server.
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: dev-image
  cancel-in-progress: true

jobs:
  image:
    name: Build and publish the dev image
    # Only ever from the dev branch, so a manual run elsewhere cannot overwrite :dev.
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: sentinel-cctv:dev-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container starts and reports healthy
        run: |
          docker run -d --name sentinel-dev -p 8090:8090 sentinel-cctv:dev-test
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8090/api/v1/system/health > /tmp/health.json; then
              echo "Healthy after ${attempt} attempt(s):"
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          echo "Container never became healthy. Logs:" >&2
          docker logs sentinel-dev >&2
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f sentinel-dev || true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=dev
            type=sha,prefix=dev-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
