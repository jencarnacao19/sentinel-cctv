name: Release image

# Publishes the server image to GHCR for every published release. Run it by
# hand (Actions → Release image → Run workflow) to rebuild an existing tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, for example v0.1.0
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}

concurrency:
  group: release-image-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  image:
    name: Build and publish image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: sentinel-cctv:release-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container starts and reports healthy
        run: |
          docker run -d --name sentinel-release -p 8090:8090 sentinel-cctv:release-test
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8090/api/v1/system/health > /tmp/health.json; then
              echo "Healthy after ${attempt} attempt(s):"
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          echo "Container never became healthy. Logs:" >&2
          docker logs sentinel-release >&2
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f sentinel-release || true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
